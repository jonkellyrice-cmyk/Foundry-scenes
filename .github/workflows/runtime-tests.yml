name: Foundry Runtime Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'module.json'
      - '.github/workflows/runtime-tests.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'module.json'
      - '.github/workflows/runtime-tests.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check runtime script syntax
        run: |
          set -euo pipefail
          node --check scripts/battlefield-dynamics-contract.mjs
          node --check scripts/battlefield-dynamics-contract.test.mjs
          node --check scripts/battlefield-dynamics-diagnostics.mjs
          node --check scripts/battlefield-dynamics-diagnostics.test.mjs
          node --check scripts/battlefield-dynamics-spatial.mjs
          node --check scripts/battlefield-dynamics-spatial.test.mjs
          node --check scripts/battlefield-dynamics-triggers.mjs
          node --check scripts/battlefield-dynamics-triggers.test.mjs
          node --check scripts/battlefield-dynamics-movement-cost.mjs
          node --check scripts/battlefield-dynamics-movement-cost.test.mjs
          node --check scripts/battlefield-dynamics-runtime.mjs
          node --check scripts/battlefield-dynamics-runtime.test.mjs
          node --check scripts/live-scene-feed.mjs
          node --check scripts/live-scene-feed.test.mjs
          node --check scripts/scene-library.mjs
          node --check scripts/comic-book-maker.mjs

      - name: Validate module manifest runtime contract
        run: |
          set -euo pipefail
          test "$(jq -r '.id' module.json)" = "orphaned-sun-scenes"
          test "$(jq -r '.socket' module.json)" = "true"

      - name: Validate Battlefield Dynamics persistence contract
        run: |
          set -euo pipefail
          grep -Fq 'BATTLEFIELD_DYNAMICS_RUNTIME_FLAG = "battlefieldDynamicsRuntime"' scripts/battlefield-dynamics-runtime.mjs
          grep -Fq 'BATTLEFIELD_DYNAMICS_RUNTIME_PERSISTENCE = "scene-flag-v1"' scripts/battlefield-dynamics-runtime.mjs

      - name: Validate Battlefield Dynamics diagnostics contract
        run: |
          set -euo pipefail
          grep -Fq 'BATTLEFIELD_DYNAMICS_DIAGNOSTICS_VERSION = 1' scripts/battlefield-dynamics-diagnostics.mjs
          grep -Fq 'automatic-instruction-executor-pending' scripts/battlefield-dynamics-diagnostics.mjs
          grep -Fq 'environment-intrinsic-unresolved' scripts/battlefield-dynamics-diagnostics.mjs

      - name: Validate Battlefield Dynamics spatial projection contract
        run: |
          set -euo pipefail
          grep -Fq 'BATTLEFIELD_DYNAMICS_SPATIAL_VERSION = 1' scripts/battlefield-dynamics-spatial.mjs
          grep -Fq 'BATTLEFIELD_DYNAMICS_PROJECTION_OWNERSHIP = "battlefield-dynamics-disposable-region"' scripts/battlefield-dynamics-spatial.mjs
          grep -Fq 'spatial-support-not-area-projectable' scripts/battlefield-dynamics-spatial.mjs
          grep -Fq 'createEmbeddedDocuments("Region"' scripts/battlefield-dynamics-spatial.mjs

      - name: Run runtime regression suite
        run: npm run test:runtime
